# Model answers for the chapter 13 self-check questions, in the same
# order as the questions in docs/ch13-philosophy-of-streaming-systems.md.
answers:
  - section: reasoning-about-dataflows
    pdf: 565
    answer: |
      With several copies of the data, the question is only ever which copy is the input and which are the outputs. If the application writes to the database and to the search index separately, nobody decides the order of concurrent writes, so the two can apply them in different orders and diverge forever. If instead every write enters one system that assigns a total order, and every derived system applies that same order, each derived system is a deterministic function of the same input: it is state machine replication, and it stays consistent barring bugs.

      Whether the ordered input is a change log captured from the database (CDC) or a log of application events (event sourcing) does not change that argument: both give a single ordered stream to derive from. That is why the book calls the single ordering system the principle and CDC versus event sourcing a detail.
  - section: derived-data-versus-distributed-transactions
    pdf: 565
    answer: |
      Both keep several systems consistent with each other. Distributed transactions do it with atomic commit and locks (two-phase commit, mutual exclusion); derived data does it with an ordered log, deterministic retry and idempotence.

      The difference the reader notices is timeliness: a transaction guarantees that once it commits, the next read sees the write, whereas derived systems update asynchronously, so a read right after the write may still see the old value. In exchange the log-based approach has better fault tolerance and performance than XA, but the book insists that "eventual consistency, suck it up" is not an answer on its own: the rest of the chapter is about how to live with that asynchrony.
  - section: the-limits-of-total-ordering
    pdf: 566
    answer: |
      A total order of all events is easy only while one node can decide it. It stops being feasible when: throughput exceeds a single node and the log must be sharded, so the order across shards is undefined; the system spans several regions with one leader per region, so there is no order across regions; the application is split into microservices each with its own state, so there is no order between events in different services; and clients keep local, offline state, so the order seen on the client differs from the order seen on the server.

      Deciding a total order is total order broadcast, which is equivalent to consensus, and consensus algorithms assume one node can handle the whole stream.
  - section: capturing-causality
    pdf: 567
    answer: |
      The unfriend and the message are two events on different objects, stored in different places (the friendship graph and the message store), so nothing orders them. The notification service is a join between messages and the current friend list; if it sees the message before the unfriend, it joins against the old friend list and notifies the ex. Causality is lost because the dependency between the two writes was never recorded anywhere.

      Conflict resolution algorithms such as CRDTs resolve concurrent updates to a piece of state, but the problem here is an external side effect: a notification, once sent, cannot be merged away or undone. Logical timestamps, or logging the state the user saw with an ID that later events reference, are the starting points the book offers.
  - section: batch-and-stream-together
    pdf: 568
    answer: |
      In a distributed transaction every participant must vote; if one is slow or down the whole transaction stalls or aborts, so a local failure becomes a global one and the system amplifies failures. With asynchronous derivation through a log, a consumer that is slow or down simply falls behind: the log buffers its backlog, the producer and the other consumers carry on, and the failure stays contained. The derivation could be done synchronously (as a relational database maintains its secondary indexes), but asynchrony is what makes the composition of many systems robust, and even cross-shard indexes are more reliable when maintained asynchronously.
  - section: batch-and-stream-together
    pdf: 568
    answer: |
      The third rail stands for reprocessing: when 19th-century English railways changed gauge they laid a third rail so that old and new trains could run on the same line for years, then removed the old gauge. In data systems you keep the old derived view, derive a new one from the same input log with the new schema or logic, move users over gradually, and only then retire the old view.

      Every step is reversible because the input is never modified: both views are derived from the same immutable history, so you can rebuild either, keep both running, or switch users back. That removes the fear of making mistakes, and systems that are less scary to change evolve faster.
  - section: composing-data-storage-technologies
    pdf: 571
    answer: |
      CREATE INDEX takes a consistent snapshot of the table, extracts and sorts the indexed values, writes the index, applies the backlog of writes that happened since the snapshot, then keeps the index up to date as the table changes. In other words the database reprocesses the existing dataset and derives a new view from it.

      That is the same procedure as setting up a new follower replica in chapter 6 (snapshot, then replay the log from that point) and as bootstrapping change data capture in chapter 12 (initial snapshot, then the stream of changes). Seen this way, batch and stream processors are elaborate index builders, and the dataflow of a whole organization looks like one huge database.
  - section: composing-data-storage-technologies
    pdf: 571
    answer: |
      A federated database unifies reads: a single query interface over many storage engines (foreign data wrappers, Trino, polystores), in the relational tradition of an integrated system with a high-level language. An unbundled database unifies writes: it keeps the different storage systems in sync through change data capture and event logs, in the Unix tradition of small tools composed through a uniform low-level interface.

      The hard problem is the write side. Mapping one data model onto another for queries is manageable; making sure every write reaches every system, exactly once and in the same order, is what the rest of the chapter is about.
  - section: making-unbundling-work
    pdf: 573
    answer: |
      Unbundling adds moving parts: more pieces of infrastructure, more learning curves, more operational quirks, and the glue between them is not free. An integrated product can be faster and more predictable on the workload it was built for. So unbundling is the wrong choice when one product already covers everything you need, or when you are building for a scale you do not have yet, which is premature optimization.

      Its goal is breadth, not depth: combining databases to cover more workloads than any single piece of software can, not making one workload faster. Keep as few moving parts as possible; unbundle only when you have hit the limits of a single system.
  - section: designing-around-dataflow
    pdf: 575
    answer: |
      With microservices the purchase code makes a synchronous request to the exchange-rate service: one more network call, one more service that can be down, and if you add a cache to avoid the call you must keep it fresh by polling. With dataflow the purchase code subscribes to the stream of exchange-rate updates and keeps the current rate in a local database; the lookup at purchase time is local, possibly in the same process, and "the fastest and most reliable network request is no network request at all". It is a stream join between purchases and rate updates.

      What stays the same: the join is time-dependent. The right rate is the one valid at the time of the purchase, so when you reprocess old purchases you need the historical rate, whether you query a service or join a stream.
  - section: observing-derived-state
    pdf: 579
    answer: |
      The write path is everything that happens to a piece of data eagerly, as soon as it is written, through batch and stream jobs, until every derived dataset has incorporated it. The read path is what happens lazily, when a user asks: read the derived dataset, process, respond. The derived dataset is where the two meet, and caches, indexes and materialized views shift that boundary: they do more work at write time so that reads need less. Full-text search without an index is all read path (grep); precomputing every query would be all write path and is impossible; an index plus a cache of common queries sits in between.

      The social timeline of chapter 2 is the same trade-off: fan-out on write pushes posts into followers' timelines eagerly, fan-out on read assembles them on request, and for celebrities the boundary is drawn differently. After 500 pages, the book says, we have come full circle.
  - section: observing-derived-state
    pdf: 579
    answer: |
      State on the device is a cache of the server's state, and the screen is a materialized view of that local replica. Once the server pushes changes (server-sent events, WebSockets) the write path extends all the way to the client: the client uses the read path only to load its initial state and then receives a stream of updates.

      An offline device is then just a consumer that stopped reading for a while. Chapter 12 already solved that: a log-based consumer keeps an offset, and when it reconnects it resumes from that offset without missing anything. Every device is a small subscriber to a small stream, exactly like a stream processor catching up on its backlog.
  - section: the-end-to-end-argument
    pdf: 586
    answer: |
      The client sends COMMIT for an $11 transfer and the connection drops before the response, so it does not know whether the transaction committed; if it reconnects and retries, the transfer runs twice and $22 moves. TCP deduplicates with sequence numbers, but only inside one connection, and the retry is a new connection. Two-phase commit breaks the binding between connection and transaction, but there is another hop: between the browser and the server. If the cellular network drops the response, the user sees an error and resubmits the form; to the server that is a brand-new request and to the database a brand-new transaction.

      What is enough is an end-to-end identifier: a UUID generated in the browser as a hidden form field (or a hash of the fields), carried through every hop to the database, with a unique constraint on the requests table. The second INSERT violates the constraint and the transaction aborts. Relational databases enforce uniqueness correctly even at weak isolation, unlike an application-level check-then-insert.
  - section: the-end-to-end-argument
    pdf: 586
    answer: |
      The end-to-end argument (Saltzer, Reed and Clark, 1984): a function can be completely and correctly implemented only with the knowledge and help of the application at the endpoints of the communication system; providing it inside the communication system is not sufficient, and at best it improves performance.

      Three examples from the book: duplicate suppression, where TCP, database transactions and exactly-once stream processing all remove duplicates at their own level but none stops a user who resubmits a form, so only an end-to-end request ID does; checksums, where Ethernet, TCP and TLS catch corruption on the wire but not a software bug at an endpoint or corruption on disk, so only an end-to-end checksum covers the whole path; and encryption, where the WiFi password protects one hop and TLS one connection, but only end-to-end encryption protects the data everywhere. The low-level mechanisms stay useful because they make the high-level problems rarer.
  - section: enforcing-constraints
    pdf: 590
    answer: |
      The client generates a request ID and appends the transfer request to the log sharded by the source account. The source account's processor keeps a local database (balance and already processed IDs) derived entirely from that log. For a new ID it checks the funds, reserves the amount and emits events carrying the same request ID: an outgoing payment on its own log, an incoming payment on the destination's log and a fee on the fees log. When the outgoing event comes back round, the source processor recognises the ID and executes the payment; the destination and fees processors apply their incoming events, each deduplicating by ID.

      Atomicity comes from the append of the initial request, which is a single atomic action: once it is in the log, everything else will follow, perhaps after a recovery, perhaps duplicated, but it will arrive. If the source processor crashes halfway, it restarts from its log, reprocesses the same request, takes the same deterministic decision and re-emits the same events with the same ID; the downstream processors ignore the duplicates. Requirements: each account's events in log order with at-least-once delivery, and deterministic processors. Same correctness as 2PC, every request applied once to both accounts, without atomic commit.
  - section: timeliness-and-integrity
    pdf: 595
    answer: |
      Timeliness means the user sees an up-to-date state; integrity means the data is not corrupted: nothing lost, nothing contradictory, nothing false, derived data correct. A timeliness violation is temporary, you wait and retry, and it is what eventual consistency allows. An integrity violation is permanent: it needs explicit checking and repair, and it results in perpetual inconsistency.

      In banking: yesterday's card charge not yet on the statement is a timeliness issue and nobody minds; a statement that does not add up to the sum of the transactions, or money charged to a customer and never paid to the merchant, is an integrity failure and a catastrophe. ACID gives both at once; dataflow systems decouple them, giving up timeliness unless the consumer waits for the output, while preserving integrity through atomic single-message writes, deterministic derivation, end-to-end request IDs and immutable, reprocessable messages.
  - section: timeliness-and-integrity
    pdf: 595
    answer: |
      Strict uniqueness needs consensus, but many applications can afford to violate an apparently hard constraint as long as they can repair it afterwards: selling more than is in stock and reordering with a discount, airlines and hotels overbooking on purpose, a bank charging an overdraft, interbank payments reconciled later. The repair is a compensating transaction, and its cost is the cost of the apology: you cannot recall an email but you can send a correction, a double charge is refunded.

      If the apology is acceptable, which is a business decision, checking every constraint before writing is needlessly restrictive: write optimistically, verify afterwards, and coordinate synchronously only before actions that are expensive to undo. These applications need integrity (reservations are never lost, money never disappears), not timeliness in enforcing the constraint. Coordination reduces the apologies for inconsistency but increases those for unavailability; you look for the right balance, never zero apologies.
  - section: trust-but-verify
    pdf: 599
    answer: |
      Disks, memory and networks get corrupted, and at a large enough scale even improbable faults happen regularly. HDFS and S3 therefore do not trust their disks: background processes continually re-read the stored files, compare them with the replicas and move or repair the ones that no longer match. If you want to know that your data is still there, you have to read it, which is also why you should restore backups once in a while.

      It says that the system model of the earlier chapters (some things happen, others never happen) is an idealisation; reality is probabilistic. Low-level checksums do not catch software bugs, and even robust databases have shipped wrong uniqueness constraints and write skew under serializable isolation. Hence auditing: verify integrity end to end over the whole pipeline, periodically, so corruption is found before it does damage downstream.
